    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
            text-align: center;
        }
        .container { max-width: 400px; width: 100%; }
        .icon {
            width: 120px; height: 120px;
            border-radius: 28px;
            background: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 60px;
            margin: 0 auto 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 { font-size: 32px; margin-bottom: 8px; font-weight: 700; }
        .subtitle { opacity: 0.9; margin-bottom: 30px; font-size: 15px; }
        .btn {
            display: block;
            background: white;
            color: #667eea;
            padding: 18px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 17px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            margin-bottom: 15px;
        }
        .btn:active { transform: scale(0.96); }
        .note {
            margin-top: 20px;
            font-size: 13px;
            opacity: 0.85;
            line-height: 1.6;
            text-align: left;
            background: rgba(255,255,255,0.15);
            padding: 15px;
            border-radius: 15px;
        }
        .note strong { display: block; margin-bottom: 8px; font-size: 14px; }
        .note ol { padding-left: 20px; }
        .note li { margin-bottom: 5px; }
    </style>
</head>
